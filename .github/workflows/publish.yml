name: publish

on:
  workflow_dispatch:
    inputs:
      otp:
        description: "npm one-time password (from your authenticator; leave empty if the token bypasses 2FA)"
        required: false

jobs:
  npm-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance attestation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm test
      - run: node bin/stead.js check
      - run: npm publish --provenance --access public ${OTP:+--otp="$OTP"}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          OTP: ${{ inputs.otp }}
